<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="非电商三方订单通用三方列表高保真原型">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233370ff'/%3E%3C/svg%3E">
  <title>运营后台 · 通用三方</title>
  <link rel="stylesheet" href="prototype.css">
  <style>
    body { min-width: 1520px; background: #f5f6f7; }
    .gt-shell { display: flex; width: 1500px; min-height: calc(100vh - 50px); background: #fff; }
    .gt-sidebar { width: 168px; flex: 0 0 168px; color: #c8d2e1; background: #071a2c; }
    .gt-sidebar__brand { height: 54px; display: flex; align-items: center; padding: 0 14px; color: #fff; font-size: 15px; font-weight: 650; border-bottom: 1px solid rgba(255,255,255,.07); }
    .gt-sidebar__group { padding: 13px 14px 7px; color: #718197; font-size: 12px; }
    .gt-sidebar__item { height: 40px; display: flex; align-items: center; padding: 0 18px; color: #c8d2e1; text-decoration: none; }
    .gt-sidebar__item:hover { color: #fff; background: rgba(255,255,255,.05); }
    .gt-sidebar__item.is-active { color: #fff; background: #1687e9; }
    .gt-main { width: 1332px; padding: 0 18px 44px; overflow: hidden; }
    .gt-breadcrumb { height: 50px; display: flex; align-items: center; color: #8f959e; border-bottom: 1px solid #edf0f3; font-size: 12px; }
    .gt-tabs { display: flex; gap: 28px; height: 52px; align-items: flex-end; border-bottom: 1px solid #e8ebef; }
    .gt-tab { position: relative; height: 52px; padding: 0 2px 13px; color: #606266; border: 0; background: transparent; cursor: pointer; font-weight: 500; }
    .gt-tab:hover { color: #1687e9; }
    .gt-tab.is-active { color: #1687e9; font-weight: 600; }
    .gt-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #1687e9; }
    .gt-filter { padding: 18px 12px 4px; }
    .gt-filter__row { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
    /* display 必须写在 [hidden] 之前并显式让位，否则 flex 会盖掉 [hidden]{display:none} */
    .gt-field { display: flex; flex-direction: column; gap: 6px; }
    .gt-field[hidden] { display: none; }
    .gt-field > label { color: #606266; white-space: nowrap; }
    .gt-field .input, .gt-field .select { width: 158px; color: #606266; }
    .gt-field--time .input { width: 330px; }
    .gt-field.is-required > label::before { content: "*"; margin-right: 3px; color: #f56c6c; }
    .gt-field .select:disabled { background: #f5f7fa; cursor: not-allowed; }
    .gt-actions { display: flex; align-items: center; gap: 10px; padding-left: 2px; }
    .gt-actions__note { color: #909399; font-size: 12px; }
    .gt-table-wrap { width: 100%; overflow-x: auto; border-top: 1px solid #f0f1f3; }
    .gt-table { width: 2780px; border-collapse: collapse; table-layout: fixed; }
    .gt-table th, .gt-table td { padding: 12px 10px; color: #606266; border-bottom: 1px solid #ebeef5; text-align: left; vertical-align: middle; font-size: 13px; }
    .gt-table th { height: 48px; color: #7a8495; background: #fff; font-weight: 600; }
    .gt-table tbody tr:hover td { background: #f7faff; }
    .gt-table .mono { color: #4e5969; font-variant-numeric: tabular-nums; word-break: break-all; }
    .gt-table .money { font-variant-numeric: tabular-nums; }
    .gt-table .muted { color: #a2a9b3; }
    .gt-table .action { color: #1687e9; border: 0; background: transparent; cursor: pointer; }
    .gt-table .action:hover { text-decoration: underline; }
    .gt-empty { padding: 70px 0; color: #a2a9b3; text-align: center; }
    .gt-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; color: #909399; font-size: 12px; }
    .gt-page-btn { min-width: 30px; height: 28px; border: 1px solid #dcdfe6; border-radius: 3px; color: #606266; background: #fff; }
    .gt-page-btn.is-current { color: #fff; border-color: #1687e9; background: #1687e9; }
  </style>
</head>
<body>
  <div id="prototypeNav"></div>
  <main id="generalThirdpartyPage" class="gt-shell" data-diff-page="运营后台 · 通用三方">
    <aside class="gt-sidebar" aria-label="后台菜单">
      <div class="gt-sidebar__brand">洋葱学园APP运营平台</div>
      <div class="gt-sidebar__group">渠道投放</div>
      <a class="gt-sidebar__item" href="javascript:void(0)">检测链接</a>
      <div class="gt-sidebar__group">第三方订单管理</div>
      <a class="gt-sidebar__item" href="javascript:void(0)">微店</a>
      <a class="gt-sidebar__item" href="javascript:void(0)">抖店</a>
      <a class="gt-sidebar__item is-active" href="javascript:void(0)">通用三方</a>
      <a class="gt-sidebar__item" href="admin-dropped-orders.html">掉单管理</a>
      <a class="gt-sidebar__item" href="admin-upload.html">三方数据管理</a>
      <a class="gt-sidebar__item" href="javascript:void(0)">激活链接配置</a>
    </aside>

    <section class="gt-main">
      <div class="gt-breadcrumb">渠道投放&nbsp; / &nbsp;通用三方</div>
      <div id="platformCategoryTabs" class="gt-tabs" role="tablist" aria-label="订单平台分类">
        <button class="gt-tab is-active" type="button" role="tab" data-tab="ecommerce" aria-selected="true">电商平台</button>
        <button class="gt-tab" type="button" role="tab" data-tab="non-ecommerce" aria-selected="false">非电商平台</button>
      </div>

      <section id="generalThirdpartyFilters" class="gt-filter" aria-label="通用三方筛选">
        <div class="gt-filter__row">
          <div class="gt-field">
            <label for="platform">第三方平台</label>
            <select id="platform" class="select"></select>
          </div>
          <div class="gt-field">
            <label id="shopIdLabel" for="shopId">店铺ID</label>
            <input id="shopId" class="input" placeholder="请输入店铺ID">
          </div>
          <div class="gt-field">
            <label id="shopNameLabel" for="shopName">店铺名称</label>
            <input id="shopName" class="input" placeholder="请输入店铺名称">
          </div>
          <div class="gt-field" id="sellfromField">
            <label for="sellfrom">渠道</label>
            <select id="sellfrom" class="select">
              <option value="">请选择渠道</option>
              <option>shangyehua_tmall</option>
              <option>xinmeiti_xiaohongshu</option>
              <option>tiyanying_tictok_applet_doubao</option>
            </select>
          </div>
          <div class="gt-field gt-field--time is-required">
            <label for="payTimeRange">订单支付时间</label>
            <input id="payTimeRange" class="input" value="2026-08-01 00:00:00 至 2026-08-25 23:59:59" readonly>
          </div>
        </div>
        <div class="gt-filter__row">
          <div class="gt-field">
            <label for="spuId">父订单ID</label>
            <input id="spuId" class="input" placeholder="请输入父订单ID">
          </div>
          <div class="gt-field">
            <label id="goodNameLabel" for="goodName">洋葱商品</label>
            <input id="goodName" class="input" placeholder="请输入洋葱商品名称">
          </div>
          <div class="gt-field">
            <label for="goodId">洋葱商品ID</label>
            <input id="goodId" class="input" placeholder="请输入洋葱商品ID">
          </div>
          <div class="gt-field">
            <label for="userId">用户ID</label>
            <input id="userId" class="input" placeholder="请输入洋葱用户ID">
          </div>
          <div class="gt-field">
            <label for="refundStatus">退款状态</label>
            <select id="refundStatus" class="select">
              <option value="">全部</option>
              <option>已处理</option>
              <option>未处理</option>
            </select>
          </div>
        </div>
        <div class="gt-actions">
          <button id="queryButton" class="btn btn--primary" type="button">查询</button>
          <button id="resetButton" class="btn" type="button">清空</button>
          <button id="exportButton" class="btn btn--primary" type="button">导出</button>
          <span class="gt-actions__note">导出需指定单个第三方平台，且时间范围不得超过 90 天</span>
        </div>
      </section>

      <div id="generalThirdpartyTable" class="gt-table-wrap">
        <table class="gt-table">
          <colgroup>
            <col style="width:180px"><col style="width:175px"><col style="width:175px"><col style="width:110px">
            <col style="width:100px"><col style="width:175px"><col style="width:100px"><col style="width:175px">
            <col style="width:150px"><col style="width:150px"><col style="width:90px"><col style="width:90px">
            <col style="width:90px"><col style="width:150px"><col style="width:130px"><col style="width:120px">
            <col style="width:140px"><col style="width:140px"><col style="width:100px"><col style="width:150px">
            <col style="width:90px">
          </colgroup>
          <thead>
            <tr>
              <th>洋葱商品名称</th><th>洋葱订单ID</th><th>洋葱商品ID</th><th>洋葱订单实付金额</th>
              <th>洋葱退款金额</th><th>洋葱兑换人用户ID</th><th>洋葱订单状态</th><th>父订单ID</th>
              <th>支付时间</th><th>订单创建时间</th><th>支付金额</th><th>订单状态</th>
              <th>退款金额</th><th>平台</th><th id="shopNameHeader">店铺名称</th><th id="shopIdHeader">店铺ID</th>
              <th>顺丰单号</th><th>普通单号</th><th>最近操作人</th><th>最近操作时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
        <div id="emptyState" class="gt-empty" hidden>暂无符合条件的订单</div>
      </div>
      <div class="gt-pagination"><span id="totalText">共 0 条</span><button class="gt-page-btn is-current">1</button><span>20 条/页</span></div>
    </section>
  </main>

  <script src="prototype.js"></script>

          ycOrderAmount: 19.9, ycRefundAmount: 0, ycUserId: '6690f21c3826f10001f32db9', ycOrderStatus: '支付成功',
          spuId: 'P803181507530099321', payTime: '2026-08-25 11:45:20', createdAt: '2026-08-25 11:45:23',
          payAmount: 19.9, orderStatus: '支付成功', refundAmount: 0, platform: '小红书', shopName: '洋葱学园课程店', shopId: 'redbook-onion',
          sfTracking: '—', tracking: 'YT7826041956231', operator: '系统', operateTime: '2026-08-25 11:45:41',
          sellfrom: 'xinmeiti_xiaohongshu', refundHandled: '已处理'
        },
        {
          ycGoodName: '初中物理实验成长包', ycOrderId: '6a8cfa206583dcd971268af2', ycGoodId: '2d331ea1-940c-4ebf-a390-721db0148850',
          ycOrderAmount: 299, ycRefundAmount: 299, ycUserId: '668d12f8da2b970001ce3cc9', ycOrderStatus: '退款成功',
          spuId: 'DOU2026082400928', payTime: '2026-08-24 20:08:11', createdAt: '2026-08-24 20:08:15',
          payAmount: 299, orderStatus: '退款成功', refundAmount: 299, platform: '抖店', shopName: '洋葱学园官方店', shopId: 'douyin-yc',
          sfTracking: 'SF1510937202846', tracking: '—', operator: '李文雅', operateTime: '2026-08-24 21:12:30',
          sellfrom: 'tiyanying_tictok_applet_doubao', refundHandled: '未处理'
        }
      ]

      const nonEcommerceRows = [
        {
          ycGoodName: '洋葱数学思维年度组合课', ycOrderId: '6a910712f4ea593f142cc001', ycGoodId: '2f6b8c10-3f5d-4e2a-a942-8b77e1c39011',
          ycOrderAmount: 899, ycRefundAmount: 0, ycUserId: '6691aa7017a25e0001c055a8', ycOrderStatus: '支付成功',
          spuId: 'xiaobaobaba20260818001', payTime: '2026-08-18 15:26:42', createdAt: '2026-08-18 15:26:42',
          payAmount: 899, orderStatus: '支付成功', refundAmount: 0, platform: '非电商平台的三方订单', shopName: '小宝爸爸', shopId: 'xiaobaobaba',
          sfTracking: 'SF1510937203108', tracking: '—', operator: '李文雅', operateTime: '2026-08-18 15:30:11',
          sellfrom: 'xinmeiti_feidianshangpingtai', refundHandled: '已处理'
        },
        {
          ycGoodName: '洋葱英语全年成长课', ycOrderId: '6a910742178ab591cdf10122', ycGoodId: '6c1e927a-7d44-4fd6-b4a1-19d2a5348f22',
          ycOrderAmount: 699, ycRefundAmount: 0, ycUserId: '6691aba336ad770001b93a12', ycOrderStatus: '支付成功',
          spuId: 'davdian20260818002', payTime: '2026-08-18 15:42:08', createdAt: '2026-08-18 15:42:08',
          payAmount: 699, orderStatus: '支付成功', refundAmount: 0, platform: '非电商平台的三方订单', shopName: '大V店', shopId: 'davdian',
          sfTracking: '—', tracking: 'JDVA00382619455', operator: '—', operateTime: '—',
          sellfrom: 'xinmeiti_feidianshangpingtai', refundHandled: '已处理'
        },
        {
          ycGoodName: '洋葱物理实验成长包', ycOrderId: '6a91078dcf01b993dd520163', ycGoodId: '9a53d870-2b16-4c99-a83f-67e45d1b7033',
          ycOrderAmount: 498, ycRefundAmount: 198, ycUserId: '6691ac1dd4f6830001c18b0a', ycOrderStatus: '支付成功',
          spuId: 'wanwuxinxuan20260818003', payTime: '2026-08-18 16:06:31', createdAt: '2026-08-18 16:06:31',
          payAmount: 498, orderStatus: '支付成功', refundAmount: 198, platform: '非电商平台的三方订单', shopName: '万物心选', shopId: 'wanwuxinxuan',
          sfTracking: 'SF1510937203672', tracking: '—', operator: '—', operateTime: '—',
          sellfrom: 'xinmeiti_feidianshangpingtai', refundHandled: '未处理'
        }
      ]

      const platformOptions = {
        ecommerce: ['', '天猫', '京东', '拼多多', '抖店', '视频号小店', '小红书', '微店', '快手', '有赞'],
        'non-ecommerce': ['', '非电商平台的三方订单']
      }

      let activeTab = 'ecommerce'
      const $ = (selector) => document.querySelector(selector)
      const $$ = (selector) => Array.from(document.querySelectorAll(selector))

      function currentRows() {
        const source = activeTab === 'ecommerce' ? ecommerceRows : nonEcommerceRows
        const platform = $('#platform').value
        const shopId = $('#shopId').value.trim()
        const shopName = $('#shopName').value.trim()
        const sellfrom = $('#sellfrom').value
        const spuId = $('#spuId').value.trim()
        const goodName = $('#goodName').value.trim()
        const goodId = $('#goodId').value.trim()
        const userId = $('#userId').value.trim()
        const refundStatus = $('#refundStatus').value
        return source.filter((row) =>
          (!platform || row.platform === platform)
          && (!shopId || row.shopId.includes(shopId))
          && (!shopName || row.shopName.includes(shopName))
          && (activeTab === 'non-ecommerce' || !sellfrom || row.sellfrom === sellfrom)
          && (!spuId || row.spuId.includes(spuId))
          && (!goodName || row.ycGoodName.includes(goodName))
          && (!goodId || row.ycGoodId.includes(goodId))
          && (!userId || row.ycUserId.includes(userId))
          && (!refundStatus || row.refundHandled === refundStatus)
        )
      }

      function renderFilterScope() {
        const nonEcommerce = activeTab === 'non-ecommerce'
        $('#platform').innerHTML = platformOptions[activeTab]
          .map((value) => `<option value="${value}">${value || '请选择'}</option>`).join('')
        $('#platform').value = nonEcommerce ? '非电商平台的三方订单' : ''
        $('#platform').disabled = nonEcommerce
        $('#shopIdLabel').textContent = nonEcommerce ? '渠道ID' : '店铺ID'
        $('#shopNameLabel').textContent = nonEcommerce ? '渠道名称' : '店铺名称'
        $('#shopId').placeholder = nonEcommerce ? '请输入渠道ID' : '请输入店铺ID'
        $('#shopName').placeholder = nonEcommerce ? '请输入渠道名称' : '请输入店铺名称'
        $('#shopIdHeader').textContent = nonEcommerce ? '渠道ID' : '店铺ID'
        $('#shopNameHeader').textContent = nonEcommerce ? '渠道名称' : '店铺名称'
        // public_sellfrom 对非电商已废弃且不写入，非电商 Tab 不提供该筛选项
        $('#sellfromField').hidden = nonEcommerce
      }

      function renderRows() {
        const rows = currentRows()
        const nonEcommerce = activeTab === 'non-ecommerce'
        $('#orderRows').innerHTML = rows.map((row) => `
          <tr>
            <td>${row.ycGoodName}</td><td class="mono">${row.ycOrderId}</td><td class="mono">${row.ycGoodId}</td>
            <td class="money">${row.ycOrderAmount}</td><td class="money">${row.ycRefundAmount}</td>
            <td class="mono">${row.ycUserId}</td><td>${row.ycOrderStatus}</td><td class="mono">${row.spuId}</td>
            <td class="mono">${row.payTime}</td><td class="mono">${row.createdAt}</td>
            <td class="money">${row.payAmount}</td><td>${row.orderStatus}</td><td class="money">${row.refundAmount}</td>
            <td>${row.platform}</td><td>${row.shopName}</td><td class="mono">${row.shopId}</td>
            <td class="mono">${row.sfTracking}</td><td class="mono">${row.tracking}</td>
            <td class="${row.operator === '—' ? 'muted' : ''}">${row.operator}</td>
            <td class="mono ${row.operateTime === '—' ? 'muted' : ''}">${row.operateTime}</td>
            <td>${nonEcommerce
              ? '<button class="action" type="button" data-act="activate">激活课程</button>'
              : '<button class="action" type="button" data-act="link">生成链接</button>'}</td>
          </tr>`).join('')
        $('#emptyState').hidden = rows.length > 0
        $('#generalThirdpartyTable').querySelector('table').hidden = rows.length === 0
        $('#totalText').textContent = `共 ${rows.length} 条`
        $$('#orderRows .action').forEach((button) => button.addEventListener('click', () => {
          window.PrototypeApp.notify(
            button.dataset.act === 'activate' ? '已生成激活课程链接，可直接激活授权' : '已生成激活洋葱订单的链接',
            'success'
          )
        }))
      }

      function resetFilters(render = true) {
        ;['shopId', 'shopName', 'spuId', 'goodName', 'goodId', 'userId'].forEach((id) => { $('#' + id).value = '' })
        $('#sellfrom').value = ''
        $('#refundStatus').value = ''
        $('#platform').value = activeTab === 'non-ecommerce' ? '非电商平台的三方订单' : ''
        if (render) renderRows()
      }

      function switchTab(tab) {
        activeTab = tab
        $$('.gt-tab').forEach((button) => {
          const active = button.dataset.tab === tab
          button.classList.toggle('is-active', active)
          button.setAttribute('aria-selected', String(active))
        })
        resetFilters(false)
        renderFilterScope()
        renderRows()
      }

      $$('.gt-tab').forEach((button) => button.addEventListener('click', () => switchTab(button.dataset.tab)))
      $('#queryButton').addEventListener('click', renderRows)
      $('#resetButton').addEventListener('click', () => resetFilters())
      $('#exportButton').addEventListener('click', () => {
        if (!$('#platform').value) {
          window.PrototypeApp.notify('导出需指定单个第三方平台', 'warning')
          return
        }
        window.PrototypeApp.notify('导出任务已创建', 'success')
      })

      window.PrototypeApp.renderNav('general')
      renderFilterScope()
      renderRows()

      window.DIFF_HOOKS = {
        locate(pageId) {
          if (pageId === 'generalThirdpartyPage') switchTab('non-ecommerce')
        },
        setDemoState(controlId, value) {
          if (controlId === 'platformView') switchTab(value)
        }
      }
    })()
  </script>
  <script>

/* ============ 原型变更标注引擎 proto-note（零依赖，可整段复用） ============

    const key = c.page + "::" + c.module;
    if (!byModule[key]) { byModule[key] = []; moduleKeys.push(key); }
    byModule[key].push(c);
  });
  const byTarget = {};
  CS.changes.filter(targeted).forEach(c => { (byTarget[c.target] = byTarget[c.target] || []).push(c); });
  const keyOf = c => c.page + "::" + c.module;

  let state = { open: true, enabled: {}, demo: {} };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (e) {}

  // 新版本新增的模块必须继承"全部显示"状态：老访客的 localStorage 里没有新模块的 key，

        (control.options || []).forEach(option => {
          const selected = state.demo[control.id] === option.value;
          html += '<button class="da-segment' + (selected ? " da-selected" : "") + '" data-demo-control="' + control.id +
            '" data-demo-value="' + option.value + '">' + option.label + "</button>";
        });
        html += "</div></div>";
      });
      html += "</section>";
    }

    html += '<div class="da-mods"><div class="da-mods-head"><span>模块</span><span class="da-bulk"><button data-all="on">全部显示</button><button data-all="off">全部隐藏</button></span></div>';
    pages.forEach(p => {
      html += '<div class="da-mod-group"><div class="da-mod-group-name">' + pageName(p) + "</div>";
      modsByPage[p].forEach(k => {
        const mod = k.split("::")[1];
        const types = [...new Set(byModule[k].map(c => TYPE_LABEL[c.type] || "变更"))].join("·");
        html += '<label class="da-mod" data-key="' + k + '"><input type="checkbox"' + (state.enabled[k] ? " checked" : "") + ">";
        html += '<span class="da-mod-name">' + mod + '</span><span class="da-mod-types">' + types + "</span></label>";
      });
      html += "</div>";
    });
    html += "</div>";

    const anyOn = CS.changes.some(isOn);
    if (!anyOn) {
      html += '<div class="da-empty">勾选模块后展示对应标注与连线</div>';
    } else {
      pages.forEach(p => {
        const list = CS.changes.filter(c => c.page === p && isOn(c) && targeted(c));
        if (!list.length) return;
        html += '<section class="da-note-section"><h3 class="da-note-heading">' + pageName(p) + "</h3>";
        list.forEach(c => { html += noteCard(c); });
        html += "</section>";
      });
      // 页面不可见的流程/链路变更统一放在最后，不连线
      const flowList = CS.changes.filter(c => isOn(c) && !targeted(c));
      if (flowList.length) {
        html += '<section class="da-note-section"><h3 class="da-note-heading">流程与链路 · 页面不可见</h3>';
        flowList.forEach(c => { html += noteCard(c); });
        html += "</section>";
      }
    }
    html += "</div>";
    panel.innerHTML = html;
    bindPanel();
  }

  function bindPanel() {
    panel.querySelector(".da-hide").addEventListener("click", () => setOpen(false));
    panel.querySelectorAll("[data-demo-control]").forEach(button => {
      button.addEventListener("click", () => {
        const controlId = button.getAttribute("data-demo-control");
        const value = button.getAttribute("data-demo-value");
        state.demo[controlId] = value;
        persist();
        window.DIFF_HOOKS.setDemoState(controlId, value);
        renderPanel();
        setTimeout(scheduleUpdate, 80);
      });
    });
    panel.querySelectorAll(".da-mod input").forEach(cb => {
      cb.addEventListener("change", () => {
        const k = cb.closest(".da-mod").getAttribute("data-key");
        state.enabled[k] = cb.checked;
        if (pinnedId && !isOn(CS.changes.find(x => x.id === pinnedId))) pinnedId = null;
        persist();
        renderPanel();
        syncAnnotations();
        applyActive();
        if (cb.checked) locateModule(k);
      });
    });
    panel.querySelectorAll("[data-all]").forEach(btn => {
      btn.addEventListener("click", () => {
        const on = btn.getAttribute("data-all") === "on";
        moduleKeys.forEach(k => { state.enabled[k] = on; });
        if (!on) pinnedId = null;
        persist(); renderPanel(); syncAnnotations(); applyActive();
      });
    });
    panel.querySelectorAll(".da-note").forEach(card => {
      const id = card.getAttribute("data-chg");
      card.addEventListener("mouseenter", () => setActive(id));
      card.addEventListener("mouseleave", () => clearActive(id));
      card.addEventListener("click", e => {
        if (e.target.closest("a")) return;
        const c = CS.changes.find(x => x.id === id);
        if (!c) return;
        pinnedId = id;
        applyActive();
        locateChange(c);
      });
    });
    panel.addEventListener("scroll", scheduleUpdate, { passive: true });
  }

  /* ---------- 锚点浮层（仅针对有 target 的变更） ---------- */
  const anchorEls = {};   // change.id -> { el, last:{x,y,shown} }
  CS.changes.filter(targeted).forEach(c => {
    const a = document.createElement("button");
    a.className = "da-anchor";
    a.setAttribute("data-da", "1");
    a.textContent = c._no;
    a.style.display = "none";
    a.addEventListener("mouseenter", () => setActive(c.id));
    a.addEventListener("mouseleave", () => clearActive(c.id));
    a.addEventListener("click", () => {
      togglePin(c.id);
      if (pinnedId === c.id) {
        const card = document.getElementById("da-note-" + c.id);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
    anchorLayer.appendChild(a);
    anchorEls[c.id] = { el: a, last: { x: -1, y: -1, shown: false } };
  });

  function targetVisible(el, rect) {
    if (!el.getClientRects().length) return false;
    // 遮挡检测（仅当取样点在视口内才有意义）：取样点若不属于目标元素（如被弹窗蒙层盖住），视为不可见。
    // 引擎自身的浮层（锚点/连线，[data-da]）不算遮挡。目标滚出视口时不做钳制——锚点随文档自然滚出即可。
    const inViewport = (x, y) => x >= 0 && x <= innerWidth && y >= 0 && y <= innerHeight;
    const hit = (x, y) => {
      const top = document.elementFromPoint(x, y);
      if (!top) return false;
      if (top.closest && top.closest("[data-da]")) return true;
      return el === top || el.contains(top) || top.contains(el);
    };
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    if (inViewport(cx, cy)) {
      if (hit(cx, cy)) return true;
      const sx = rect.left + 10, sy = rect.top + 10;
      if (inViewport(sx, sy)) return hit(sx, sy);
      return false;
    }
    return true;
  }

  function syncAnnotations() {
    Object.keys(byTarget).forEach(t => {
      const el = document.querySelector(t);
      if (!el) return;
      const on = byTarget[t].some(isOn) && state.open;
      el.classList.toggle("da-outlined", on);
    });
    scheduleUpdate();
  }

  function updateOverlay() {
    // 弹窗跟随页面滚动（横/纵；滚动/弹窗开合都会触发本函数，随动即可）
    syncDialogFollow();
    // 锚点钉在目标左上角，使用文档坐标（以锚点层自身为基准），随页面原生滚动——
    // 杜绝 fixed 浮层"滚动事件追帧"造成的抖动漂移，也不做视口钳制（滚出即自然滚出）
    const layerRect = anchorLayer.getBoundingClientRect();
    Object.keys(byTarget).forEach(t => {
      const el = document.querySelector(t);
      const rect = el ? el.getBoundingClientRect() : null;
      const visible = el && state.open && rect && targetVisible(el, rect);
      byTarget[t].forEach((c, slot) => {
        const rec = anchorEls[c.id];
        const show = visible && isOn(c);
        if (!show) {
          if (rec.last.shown) { rec.el.style.display = "none"; rec.last.shown = false; }
          return;
        }
        const x = Math.max(rect.left - 11, 2) + slot * 25 - layerRect.left;
        const y = rect.top - 11 - layerRect.top;
        if (!rec.last.shown) { rec.el.style.display = "grid"; rec.last.shown = true; }
        if (rec.last.x !== x || rec.last.y !== y) {
          rec.el.style.left = x + "px";
          rec.el.style.top = y + "px";
          rec.last.x = x; rec.last.y = y;
        }
      });
    });
    drawWires();
  }

  /* ---------- 连线 ---------- */
  function setWireSize() {
    const ratio = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(innerWidth * ratio));
    const h = Math.max(1, Math.round(innerHeight * ratio));
    if (wires.width !== w || wires.height !== h) { wires.width = w; wires.height = h; }
    wctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function wirePath(sx, sy, ex, ey, active) {
    const gap = Math.max(38, ex - sx);
    wctx.save();
    wctx.beginPath();
    wctx.moveTo(sx, sy);
    wctx.bezierCurveTo(sx + Math.min(120, gap * 0.42), sy, ex - Math.min(82, gap * 0.28), ey, ex, ey);
    wctx.lineWidth = active ? 2 : 1.3;
    wctx.strokeStyle = active ? "rgba(44,147,232,.96)" : "rgba(44,147,232,.42)";
    wctx.shadowColor = active ? "rgba(44,147,232,.7)" : "transparent";
    wctx.shadowBlur = active ? 9 : 0;
    wctx.stroke();
    wctx.shadowBlur = 0;
    wctx.beginPath(); wctx.arc(sx, sy, active ? 3.2 : 2.1, 0, Math.PI * 2);
    wctx.fillStyle = active ? "#2c93e8" : "rgba(44,147,232,.5)"; wctx.fill();
    wctx.beginPath(); wctx.arc(ex - 1, ey, active ? 3 : 2, 0, Math.PI * 2);
    wctx.fillStyle = active ? "#72c4ff" : "rgba(114,196,255,.45)"; wctx.fill();
    wctx.restore();
  }

  function drawWires() {
    setWireSize();
    wctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!state.open) return;
    // 一个编号一条线：固定态优先于悬停态（滚动中误触发的 hover 不得篡改已选中的连线）
    const id = pinnedId || activeId;
    if (!id) return;
    const c = CS.changes.find(x => x.id === id);
    if (!c || !isOn(c) || !targeted(c)) return;
    const rec = anchorEls[id];
    if (!rec || !rec.last.shown) return;
    // 起点取锚点实时视口坐标（锚点在文档流中，滚动时坐标必须现算，不能用缓存）
    const ar = rec.el.getBoundingClientRect();
    if (ar.bottom < 0 || ar.top > innerHeight) return; // 锚点滚出视口则不画线
    const card = document.getElementById("da-note-" + id);
    if (!card) return;
    const cr = card.querySelector(".da-no").getBoundingClientRect();
    if (cr.bottom < 40 || cr.top > innerHeight - 8) return;
    wirePath(ar.right, ar.top + ar.height / 2, innerWidth - PANEL_W + 1, cr.top + cr.height / 2, true);
  }

  /* ---------- 高亮联动 ---------- */
  function applyActive() {
    // 固定态优先：钉住某编号后，悬停其他锚点不改变高亮与连线
    const id = pinnedId || activeId;
    CS.changes.forEach(c => {
      const rec = anchorEls[c.id];
      if (rec) rec.el.classList.toggle("da-active", c.id === id);
      const card = document.getElementById("da-note-" + c.id);
      if (card) card.classList.toggle("da-active", c.id === id);
    });
    drawWires();
  }
  function setActive(id) { activeId = id; applyActive(); }
  function clearActive(id) { if (activeId === id) { activeId = null; applyActive(); } }
  function togglePin(id) {
    pinnedId = pinnedId === id ? null : id;
    applyActive();
  }

  /* ---------- 定位 ---------- */
  function locateChange(c) {
    // 先执行页面钩子（可能需要打开弹窗），再轮询等待目标挂载/弹窗动画结束后定位。
    if (window.DIFF_HOOKS && typeof window.DIFF_HOOKS.locate === "function") window.DIFF_HOOKS.locate(c.page);
    else if (window.DIFF_HOOKS && typeof window.DIFF_HOOKS.showPage === "function") window.DIFF_HOOKS.showPage(c.page);
    if (!targeted(c)) { scheduleUpdate(); return; }
    let tries = 0;
    const attempt = () => {
      const el = document.querySelector(c.target);
      if (!el || !el.getClientRects().length) {
        if (++tries < 12) { setTimeout(attempt, 130); }
        return;
      }
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.classList.remove("da-pulsing"); void el.offsetWidth; el.classList.add("da-pulsing");
      setTimeout(() => el.classList.remove("da-pulsing"), 2000);
      scheduleUpdate();
      setTimeout(scheduleUpdate, 360); // 弹窗打开动画结束后再校准一次锚点与连线
    };
    setTimeout(attempt, 160);
  }
  function locateModule(key) { locateChange(byModule[key][0]); }

  /* ---------- 内容视口 ---------- */
  function syncScrollSpace() {
    if (!state.open) return;
    // 业务内容宽度用 document.body.scrollWidth 测：spacer 是 body 下的 absolute 子元素，
    // 它贡献的是 html 的滚动区而非 body.scrollWidth，所以测量全程不需要隐藏/移动 spacer——
    // scrollWidth 不会瞬间收缩，浏览器也就不会钳制 scrollLeft。
    // （旧实现先 display:none 再测量，页面若设了 scroll-behavior:smooth，恢复滚动是异步动画，
    //   会和用户正在进行的横向拖拽打架，表现为"一拽就弹回"。）
    const contentWidth = Math.max(document.documentElement.clientWidth, document.body.scrollWidth);
    const next = contentWidth + "px";
    scrollSpacer.style.display = "block";
    if (scrollSpacer.style.left !== next) {
      const sx = window.scrollX, sy = window.scrollY;
      scrollSpacer.style.left = next;
      // 内容变窄仍可能钳制一次，必须用 instant 立即恢复，绝不能吃页面的 scroll-behavior:smooth
      if (window.scrollX !== sx || window.scrollY !== sy) window.scrollTo({ left: sx, top: sy, behavior: "instant" });
    }
  }

  /* ---------- 弹窗跟随页面滚动 ----------
     Element 弹窗容器是 position:fixed，不随文档滚动。批注栏开着时：
     - 横滚：被批注栏遮住的弹窗右侧要能拖出来；
     - 纵滚：高于视口的弹窗底部要能跟着底页一起滚出。
     做法：批注栏开启时，把弹窗容器（不含蒙层）按 (-scrollX, -scrollY) 平移，
     弹窗与底层页面同步滑动；收起批注栏时清掉 transform。 */
  function syncDialogFollow() {
    const sx = state.open ? window.scrollX : 0;
    const sy = state.open ? window.scrollY : 0;
    const tf = (sx || sy) ? ("translate(" + (-sx) + "px," + (-sy) + "px)") : "";
    document.querySelectorAll(".el-dialog__wrapper, .el-overlay-dialog").forEach(w => {
      if (!(w.offsetWidth || w.offsetHeight)) return;
      if (w.style.transform !== tf) w.style.transform = tf;
    });
  }

  /* ---------- 开关 ---------- */
  function setOpen(open) {
    state.open = open;
    persist();
    document.documentElement.classList.toggle("da-open", open);
    document.body.classList.toggle("da-open", open);
    panel.style.display = open ? "" : "none";
    launcher.style.display = open ? "none" : "";
    if (open) {
      syncScrollSpace();
    } else {
      scrollSpacer.style.display = "none";
      if (scrollX) window.scrollTo(0, scrollY);
    }
    syncAnnotations();
  }
  launcher.addEventListener("click", () => setOpen(true));

  /* ---------- 更新调度 ---------- */
  let frame = 0;
  function scheduleUpdate() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(updateOverlay);
  }
  window.addEventListener("scroll", scheduleUpdate, { passive: true, capture: true });
  window.addEventListener("resize", () => {
    syncScrollSpace();
    scheduleUpdate();
  }, { passive: true });
  document.addEventListener("click", e => {
    if (e.target.closest("[data-da]")) return;
    setTimeout(scheduleUpdate, 60);
    setTimeout(scheduleUpdate, 360);
  }, true);
  const mo = new MutationObserver(records => {
    if (records.every(r => r.target && r.target.closest && r.target.closest("[data-da]"))) return;
    syncScrollSpace();
    scheduleUpdate();
  });
  mo.observe(document.body, { attributes: true, attributeFilter: ["class", "style"], childList: true, subtree: true });

  /* ---------- 初始 ---------- */
  if (window.DIFF_HOOKS && typeof window.DIFF_HOOKS.setDemoState === "function") {
    demoControls.forEach(control => window.DIFF_HOOKS.setDemoState(control.id, state.demo[control.id]));
  }
  renderPanel();
  setOpen(state.open);
  setTimeout(scheduleUpdate, 150);
})();

  </script>
</body>
</html>
