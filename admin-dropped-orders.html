<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="非电商三方订单掉单管理高保真原型">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233370ff'/%3E%3C/svg%3E">
  <title>运营后台 · 掉单管理</title>
  <link rel="stylesheet" href="prototype.css">
  <style>
    body { min-width: 1520px; background: #f5f6f7; }
    .drop-shell { display: flex; width: 1500px; min-height: calc(100vh - 50px); background: #fff; }
    .drop-sidebar { width: 168px; flex: 0 0 168px; color: #c8d2e1; background: #071a2c; }
    .drop-sidebar__brand { height: 54px; display: flex; align-items: center; padding: 0 14px; color: #fff; font-size: 15px; font-weight: 650; border-bottom: 1px solid rgba(255,255,255,.07); }
    .drop-sidebar__group { padding: 13px 14px 7px; color: #718197; font-size: 12px; }
    .drop-sidebar__item { height: 40px; display: flex; align-items: center; padding: 0 18px; color: #c8d2e1; text-decoration: none; }
    .drop-sidebar__item:hover { color: #fff; background: rgba(255,255,255,.05); }
    .drop-sidebar__item.is-active { color: #fff; background: #1687e9; }
    .drop-main { width: 1332px; padding: 0 18px 44px; overflow: hidden; }
    .drop-breadcrumb { height: 50px; display: flex; align-items: center; color: #8f959e; border-bottom: 1px solid #edf0f3; font-size: 12px; }
    .drop-tabs { display: flex; gap: 28px; height: 52px; align-items: flex-end; border-bottom: 1px solid #e8ebef; }
    .drop-tab { position: relative; height: 52px; padding: 0 2px 13px; color: #606266; border: 0; background: transparent; cursor: pointer; font-weight: 500; }
    .drop-tab:hover { color: #1687e9; }
    .drop-tab.is-active { color: #1687e9; font-weight: 600; }
    .drop-tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #1687e9; }
    .drop-filter { padding: 18px 12px 4px; }
    .drop-filter__row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .drop-field { display: flex; align-items: center; gap: 8px; }
    .drop-field label { width: 58px; color: #606266; text-align: right; white-space: nowrap; }
    .drop-field .input, .drop-field .select { min-width: 150px; width: 150px; color: #606266; }
    .drop-field--wide .input { width: 236px; }
    .drop-field--time .input { width: 330px; }
    .drop-actions { padding-left: 2px; }
    .drop-actions .btn + .btn { margin-left: 8px; }
    .drop-table-wrap { width: 100%; overflow-x: auto; border-top: 1px solid #f0f1f3; }
    .drop-table { width: 1580px; border-collapse: collapse; table-layout: fixed; }
    .drop-table th, .drop-table td { min-height: 54px; padding: 12px 10px; color: #606266; border-bottom: 1px solid #ebeef5; text-align: left; vertical-align: middle; font-size: 13px; }
    .drop-table th { height: 48px; color: #7a8495; background: #fff; font-weight: 600; }
    .drop-table tbody tr:hover td { background: #f7faff; }
    .drop-table .mono { color: #4e5969; font-variant-numeric: tabular-nums; word-break: break-all; }
    .drop-table .money { font-variant-numeric: tabular-nums; }
    .drop-table .reason { line-height: 1.6; }
    .drop-table .action { color: #1687e9; border: 0; background: transparent; cursor: pointer; }
    .drop-table .action:hover { text-decoration: underline; }
    .drop-result { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .drop-result::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #e6a23c; }
    .drop-result.is-done::before { background: #00a870; }
    .drop-empty { padding: 70px 0; color: #a2a9b3; text-align: center; }
    .drop-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 16px; color: #909399; font-size: 12px; }
    .drop-page-btn { min-width: 30px; height: 28px; border: 1px solid #dcdfe6; border-radius: 3px; color: #606266; background: #fff; }
    .drop-page-btn.is-current { color: #fff; border-color: #1687e9; background: #1687e9; }
    .modal--supply { width: 480px; }
    .modal--supply .modal__title { margin: 0; font-size: 16px; }
    .modal--supply .modal__body { padding: 22px 24px 10px; }
    .modal--supply .drop-field { margin-bottom: 16px; }
    .modal--supply .drop-field label { width: 100px; }
    .modal--supply .input { width: 290px; }
    .drop-dialog__tip { margin: -4px 0 0 108px; color: #909399; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="prototypeNav"></div>
  <main id="droppedOrderPage" class="drop-shell" data-diff-page="运营后台 · 掉单管理">
    <span id="supplyDialogPageMeta" data-diff-page="掉单修改弹窗" hidden></span>
    <aside class="drop-sidebar" aria-label="后台菜单">
      <div class="drop-sidebar__brand">洋葱学园APP运营平台</div>
      <div class="drop-sidebar__group">渠道投放</div>
      <a class="drop-sidebar__item" href="javascript:void(0)">检测链接</a>
      <div class="drop-sidebar__group">第三方订单管理</div>
      <a class="drop-sidebar__item" href="javascript:void(0)">微店</a>
      <a class="drop-sidebar__item" href="javascript:void(0)">抖店</a>
      <a class="drop-sidebar__item" href="javascript:void(0)">通用三方</a>
      <a class="drop-sidebar__item is-active" href="javascript:void(0)">掉单管理</a>
      <a class="drop-sidebar__item" href="admin-upload.html">三方数据管理</a>
      <a class="drop-sidebar__item" href="javascript:void(0)">激活链接配置</a>
    </aside>

    <section class="drop-main">
      <div class="drop-breadcrumb">渠道投放&nbsp; / &nbsp;掉单管理</div>
      <div id="platformCategoryTabs" class="drop-tabs" role="tablist" aria-label="订单平台分类">
        <button class="drop-tab is-active" type="button" role="tab" data-tab="ecommerce" aria-selected="true">电商平台</button>
        <button class="drop-tab" type="button" role="tab" data-tab="non-ecommerce" aria-selected="false">非电商平台</button>
      </div>

      <section id="droppedOrderFilters" class="drop-filter" aria-label="掉单筛选">
        <div class="drop-filter__row">
          <div class="drop-field">
            <label for="platform">第三方平台</label>
            <select id="platform" class="select"></select>
          </div>
          <div class="drop-field">
            <label id="shopIdLabel" for="shopId">店铺ID</label>
            <input id="shopId" class="input" placeholder="请输入店铺ID">
          </div>
          <div class="drop-field">
            <label id="shopNameLabel" for="shopName">店铺名称</label>
            <input id="shopName" class="input" placeholder="请输入店铺名称">
          </div>
          <div class="drop-field drop-field--wide">
            <label for="spuId">父订单ID</label>
            <input id="spuId" class="input" placeholder="请输入父订单ID">
          </div>
        </div>
        <div class="drop-filter__row">
          <div class="drop-field drop-field--time">
            <label for="createTime">订单创建时间</label>
            <input id="createTime" class="input" placeholder="开始创建时间  至  结束创建时间" readonly>
          </div>
          <div class="drop-field">
            <label for="reason">掉单原因</label>
            <select id="reason" class="select">
              <option value="">请选择掉单原因</option>
              <option>配置的组合商品ID错误</option>
              <option>创建洋葱订单失败</option>
              <option>组合商品库存不足</option>
            </select>
          </div>
          <div class="drop-field">
            <label for="result">处理结果</label>
            <select id="result" class="select">
              <option value="">请选择处理结果</option>
              <option>待处理</option>
              <option>已完成</option>
            </select>
          </div>
        </div>
        <div class="drop-actions">
          <button id="queryButton" class="btn btn--primary" type="button">查询</button>
          <button id="resetButton" class="btn" type="button">清空</button>
        </div>
      </section>

      <div id="droppedOrderTable" class="drop-table-wrap">
        <table class="drop-table">
          <colgroup>
            <col style="width:140px"><col style="width:220px"><col style="width:145px"><col style="width:90px">
            <col style="width:100px"><col style="width:90px"><col style="width:110px"><col style="width:150px">
            <col style="width:110px"><col style="width:200px"><col style="width:80px"><col style="width:110px">
          </colgroup>
          <thead>
            <tr>
              <th>父订单ID</th><th>商品名称</th><th>支付时间</th><th>支付金额</th>
              <th>订单状态</th><th>退款金额</th><th>平台</th><th id="shopNameHeader">店铺名称</th>
              <th id="shopIdHeader">店铺ID</th><th>掉单原因</th><th>操作</th><th>处理结果</th>
            </tr>
          </thead>
          <tbody id="dropRows"></tbody>
        </table>
        <div id="emptyState" class="drop-empty" hidden>暂无符合条件的掉单记录</div>
      </div>
      <div class="drop-pagination"><span id="totalText">共 0 条</span><button class="drop-page-btn is-current">1</button><span>20 条/页</span></div>
    </section>
  </main>

  <div id="supplyDialog" class="modal-mask">
    <section class="modal modal--supply" role="dialog" aria-modal="true" aria-labelledby="supplyDialogTitle">
      <header class="modal__header">
        <h2 id="supplyDialogTitle" class="modal__title">修改掉单</h2>
        <button id="closeDialog" class="modal__close" type="button" aria-label="关闭">×</button>
      </header>
      <div class="modal__body">
        <div class="drop-field"><label for="dialogOrderId">父订单ID</label><input id="dialogOrderId" class="input" readonly></div>
        <div class="drop-field"><label for="ycSkuId">洋葱SKU组ID</label><input id="ycSkuId" class="input" placeholder="请输入正确的洋葱SKU组ID"></div>
        <p class="drop-dialog__tip">非电商订单使用导入数据完成补单，不调用电商平台订单查询接口；提交成功后同步更新页面与掉单表。</p>
      </div>
      <footer class="modal__footer">
        <button id="cancelDialog" class="btn" type="button">取消</button>
        <button id="submitSupply" class="btn btn--primary" type="button">确认处理</button>
      </footer>
    </section>
  </div>

  <script src="prototype.js"></script>
  <script>
    (function () {
      const ecommerceRows = [
        { id: '5118915171116035443', product: '洋葱学园VIP初中数学同步课', time: '2026-06-08 09:56:38', amount: 493, status: '支付成功', refund: 0, platform: '天猫', shopName: '洋葱学园旗舰店', shopId: '499187844', reason: '配置的组合商品ID错误', result: '待处理' },
        { id: '5118848894159060001', product: '洋葱学园VIP初中科学同步课', time: '2026-06-03 23:57:13', amount: 558, status: '支付成功', refund: 0, platform: '天猫', shopName: '洋葱学园旗舰店', shopId: '499187844', reason: '配置的组合商品ID错误', result: '已完成' }
      ]
      const nonEcommerceRows = [
        { id: 'xiaobaobaba20260818001', product: '洋葱数学思维年度组合课', time: '2026-08-18 15:26:42', amount: 899, status: '支付成功', refund: 0, platform: '非电商平台的三方订单', shopName: '小宝爸爸', shopId: 'xiaobaobaba', reason: '组合商品库存不足', result: '待处理' },
        { id: 'davdian20260818002', product: '洋葱英语全年成长课', time: '2026-08-18 15:42:08', amount: 699, status: '支付成功', refund: 0, platform: '非电商平台的三方订单', shopName: '大V店', shopId: 'davdian', reason: '创建洋葱订单失败', result: '待处理' },
        { id: 'wanwuxinxuan20260818003', product: '洋葱物理实验成长包', time: '2026-08-18 16:06:31', amount: 498, status: '支付成功', refund: 0, platform: '非电商平台的三方订单', shopName: '万物心选', shopId: 'wanwuxinxuan', reason: '配置的组合商品ID错误', result: '已完成' }
      ]
      let activeTab = 'ecommerce'
      let selectedId = ''
      let demoState = 'normal'
      const $ = (selector) => document.querySelector(selector)
      const $$ = (selector) => Array.from(document.querySelectorAll(selector))
      const platformOptions = {
        ecommerce: ['', '天猫', '京东', '拼多多', '抖店', '视频号小店', '小红书', '微店', '快手', '有赞'],
        'non-ecommerce': ['', '非电商平台的三方订单']
      }

      function currentRows() {
        if (demoState === 'empty') return []
        const source = activeTab === 'ecommerce' ? ecommerceRows : nonEcommerceRows
        return source.filter((row) => {
          const platform = $('#platform').value
          const shopId = $('#shopId').value.trim()
          const shopName = $('#shopName').value.trim()
          const spuId = $('#spuId').value.trim()
          const reason = $('#reason').value
          const result = $('#result').value
          return (!platform || row.platform === platform)
            && (!shopId || row.shopId.includes(shopId))
            && (!shopName || row.shopName.includes(shopName))
            && (!spuId || row.id.includes(spuId))
            && (!reason || row.reason === reason)
            && (!result || row.result === result)
        })
      }

      function renderPlatformOptions() {
        $('#platform').innerHTML = platformOptions[activeTab].map((value) =>
          `<option value="${value}">${value || '请选择'}</option>`
        ).join('')
        const nonEcommerce = activeTab === 'non-ecommerce'
        $('#platform').value = nonEcommerce ? '非电商平台的三方订单' : ''
        $('#platform').disabled = nonEcommerce
        $('#shopIdLabel').textContent = nonEcommerce ? '渠道ID' : '店铺ID'
        $('#shopNameLabel').textContent = nonEcommerce ? '渠道名称' : '店铺名称'
        $('#shopId').placeholder = nonEcommerce ? '请输入渠道ID' : '请输入店铺ID'
        $('#shopName').placeholder = nonEcommerce ? '请输入渠道名称' : '请输入店铺名称'
        $('#shopIdHeader').textContent = nonEcommerce ? '渠道ID' : '店铺ID'
        $('#shopNameHeader').textContent = nonEcommerce ? '渠道名称' : '店铺名称'
      }

      function renderRows() {
        const rows = currentRows()
        $('#dropRows').innerHTML = rows.map((row) => `
          <tr>
            <td class="mono">${row.id}</td><td>${row.product}</td><td class="mono">${row.time}</td>
            <td class="money">${row.amount}</td><td>${row.status}</td><td class="money">${row.refund}</td>
            <td>${row.platform}</td><td>${row.shopName}</td><td class="mono">${row.shopId}</td>
            <td class="reason">${row.reason}</td>
            <td>${row.result === '待处理' ? `<button class="action" data-id="${row.id}">修改</button>` : ''}</td>
            <td><span class="drop-result ${row.result === '已完成' ? 'is-done' : ''}">${row.result}</span></td>
          </tr>`).join('')
        $('#emptyState').hidden = rows.length > 0
        $('#droppedOrderTable').querySelector('table').hidden = rows.length === 0
        $('#totalText').textContent = `共 ${rows.length} 条`
        $$('.action').forEach((button) => button.addEventListener('click', () => openDialog(button.dataset.id)))
      }

      function switchTab(tab) {
        activeTab = tab
        $$('.drop-tab').forEach((button) => {
          const active = button.dataset.tab === tab
          button.classList.toggle('is-active', active)
          button.setAttribute('aria-selected', String(active))
        })
        resetFilters(false)
        renderPlatformOptions()
        renderRows()
      }

      function resetFilters(render = true) {
        ['shopId', 'shopName', 'spuId', 'reason', 'result'].forEach((id) => { $('#' + id).value = '' })
        $('#platform').value = activeTab === 'non-ecommerce' ? '非电商平台的三方订单' : ''
        if (render) renderRows()
      }

      function openDialog(id) {
        selectedId = id
        $('#dialogOrderId').value = id
        $('#ycSkuId').value = ''
        $('#supplyDialog').classList.add('is-open')
      }

      function closeDialog() {
        $('#supplyDialog').classList.remove('is-open')
      }

      function submitSupply() {
        const sku = $('#ycSkuId').value.trim()
        if (!sku) {
          window.PrototypeApp.notify('请输入洋葱SKU组ID', 'warning')
          return
        }
        const row = nonEcommerceRows.find((item) => item.id === selectedId) || ecommerceRows.find((item) => item.id === selectedId)
        if (row) row.result = '已完成'
        closeDialog()
        renderRows()
        window.PrototypeApp.notify('补单成功，页面与多维表格已同步更新', 'success')
      }

      $$('.drop-tab').forEach((button) => button.addEventListener('click', () => switchTab(button.dataset.tab)))
      $('#queryButton').addEventListener('click', renderRows)
      $('#resetButton').addEventListener('click', () => resetFilters())
      $('#closeDialog').addEventListener('click', closeDialog)
      $('#cancelDialog').addEventListener('click', closeDialog)
      $('#submitSupply').addEventListener('click', submitSupply)
      $('#supplyDialog').addEventListener('click', (event) => { if (event.target === event.currentTarget) closeDialog() })
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeDialog() })
      window.PrototypeApp.renderNav('dropped')
      renderPlatformOptions()
      renderRows()

      window.DIFF_HOOKS = {
        locate(pageId) {
          closeDialog()
          if (pageId === 'droppedOrderPage') switchTab('non-ecommerce')
          if (pageId === 'supplyDialogPageMeta') {
            switchTab('non-ecommerce')
            openDialog('xiaobaobaba20260818001')
          }
        },
        setDemoState(controlId, value) {
          if (controlId === 'dropState') {
            demoState = value
            renderRows()
          }
        }
      }
    })()
  </script>

  const pages = [];

  moduleKeys.forEach(k => {

  function noteCard(c) {
    let html = '<article class="da-note' + (targeted(c) ? "" : " da-nowire") + '" id="da-note-' + c.id + '" data-chg="' + c.id + '">';
    html += '<div class="da-note-head"><span class="da-no">' + c._no + '</span><span>' + c.title + '</span>';

  function renderPanel() {

      modsByPage[p].forEach(k => {
        const mod = k.split("::")[1];

      html += "</div>";
    });
    html += "</div>";

    if (!anyOn) {
      html += '<div class="da-empty">勾选模块后展示对应标注与连线</div>';
    } else {
      pages.forEach(p => {
        const list = CS.changes.filter(c => c.page === p && isOn(c) && targeted(c));
        if (!list.length) return;
        html += '<section class="da-note-section"><h3 class="da-note-heading">' + pageName(p) + "</h3>";
        list.forEach(c => { html += noteCard(c); });
        html += "</section>";
      });
      // 页面不可见的流程/链路变更统一放在最后，不连线
      const flowList = CS.changes.filter(c => isOn(c) && !targeted(c));
      if (flowList.length) {
        html += '<section class="da-note-section"><h3 class="da-note-heading">流程与链路 · 页面不可见</h3>';
        flowList.forEach(c => { html += noteCard(c); });
        html += "</section>";
      }

    html += "</div>";
    panel.innerHTML = html;
    bindPanel();
  }

  function bindPanel() {
    panel.querySelector(".da-hide").addEventListener("click", () => setOpen(false));

        persist();
        window.DIFF_HOOKS.setDemoState(controlId, value);
        renderPanel();
        setTimeout(scheduleUpdate, 80);
      });
    });
    panel.querySelectorAll(".da-mod input").forEach(cb => {
      cb.addEventListener("change", () => {

        if (pinnedId && !isOn(CS.changes.find(x => x.id === pinnedId))) pinnedId = null;
        persist();
        renderPanel();
        syncAnnotations();
        applyActive();
        if (cb.checked) locateModule(k);
      });

      btn.addEventListener("click", () => {
        const on = btn.getAttribute("data-all") === "on";
        moduleKeys.forEach(k => { state.enabled[k] = on; });
        if (!on) pinnedId = null;
        persist(); renderPanel(); syncAnnotations(); applyActive();
      });

      const id = card.getAttribute("data-chg");
      card.addEventListener("mouseenter", () => setActive(id));
      card.addEventListener("mouseleave", () => clearActive(id));

        if (e.target.closest("a")) return;
        const c = CS.changes.find(x => x.id === id);
        if (!c) return;
        pinnedId = id;
        applyActive();
        locateChange(c);
      });
    });
    panel.addEventListener("scroll", scheduleUpdate, { passive: true });
  }

  /* ---------- 锚点浮层（仅针对有 target 的变更） ---------- */
  const anchorEls = {};   // change.id -> { el, last:{x,y,shown} }
  CS.changes.filter(targeted).forEach(c => {
    const a = document.createElement("button");
    a.className = "da-anchor";
    a.setAttribute("data-da", "1");
    a.textContent = c._no;
    a.style.display = "none";

      if (pinnedId === c.id) {
        const card = document.getElementById("da-note-" + c.id);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
    anchorLayer.appendChild(a);
    anchorEls[c.id] = { el: a, last: { x: -1, y: -1, shown: false } };
  });

  function targetVisible(el, rect) {
    if (!el.getClientRects().length) return false;
    // 遮挡检测（仅当取样点在视口内才有意义）：取样点若不属于目标元素（如被弹窗蒙层盖住），视为不可见。
    // 引擎自身的浮层（锚点/连线，[data-da]）不算遮挡。目标滚出视口时不做钳制——锚点随文档自然滚出即可。
    const inViewport = (x, y) => x >= 0 && x <= innerWidth && y >= 0 && y <= innerHeight;
    const hit = (x, y) => {
      const top = document.elementFromPoint(x, y);
      if (!top) return false;
      if (top.closest && top.closest("[data-da]")) return true;
      return el === top || el.contains(top) || top.contains(el);
    };
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    if (inViewport(cx, cy)) {
      if (hit(cx, cy)) return true;
      const sx = rect.left + 10, sy = rect.top + 10;
      if (inViewport(sx, sy)) return hit(sx, sy);
      return false;
    }
    return true;
  }

  function syncAnnotations() {
    Object.keys(byTarget).forEach(t => {
      const el = document.querySelector(t);
      if (!el) return;
      const on = byTarget[t].some(isOn) && state.open;
      el.classList.toggle("da-outlined", on);
    });
    scheduleUpdate();
  }

  function updateOverlay() {
    // 弹窗跟随页面滚动（横/纵；滚动/弹窗开合都会触发本函数，随动即可）
    syncDialogFollow();
    // 锚点钉在目标左上角，使用文档坐标（以锚点层自身为基准），随页面原生滚动——
    // 杜绝 fixed 浮层"滚动事件追帧"造成的抖动漂移，也不做视口钳制（滚出即自然滚出）
    const layerRect = anchorLayer.getBoundingClientRect();
    Object.keys(byTarget).forEach(t => {
      const el = document.querySelector(t);
      const rect = el ? el.getBoundingClientRect() : null;
      const visible = el && state.open && rect && targetVisible(el, rect);
      byTarget[t].forEach((c, slot) => {
        const rec = anchorEls[c.id];
        const show = visible && isOn(c);
        if (!show) {
          if (rec.last.shown) { rec.el.style.display = "none"; rec.last.shown = false; }
          return;
        }
        const x = Math.max(rect.left - 11, 2) + slot * 25 - layerRect.left;
        const y = rect.top - 11 - layerRect.top;
        if (!rec.last.shown) { rec.el.style.display = "grid"; rec.last.shown = true; }
        if (rec.last.x !== x || rec.last.y !== y) {
          rec.el.style.left = x + "px";
          rec.el.style.top = y + "px";
          rec.last.x = x; rec.last.y = y;
        }
      });
    });
    drawWires();
  }

  /* ---------- 连线 ---------- */
  function setWireSize() {
    const ratio = Math.min(devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(innerWidth * ratio));
    const h = Math.max(1, Math.round(innerHeight * ratio));
    if (wires.width !== w || wires.height !== h) { wires.width = w; wires.height = h; }
    wctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function wirePath(sx, sy, ex, ey, active) {
    const gap = Math.max(38, ex - sx);
    wctx.save();
    wctx.beginPath();
    wctx.moveTo(sx, sy);
    wctx.bezierCurveTo(sx + Math.min(120, gap * 0.42), sy, ex - Math.min(82, gap * 0.28), ey, ex, ey);
    wctx.lineWidth = active ? 2 : 1.3;
    wctx.strokeStyle = active ? "rgba(44,147,232,.96)" : "rgba(44,147,232,.42)";
    wctx.shadowColor = active ? "rgba(44,147,232,.7)" : "transparent";
    wctx.shadowBlur = active ? 9 : 0;
    wctx.stroke();
    wctx.shadowBlur = 0;
    wctx.beginPath(); wctx.arc(sx, sy, active ? 3.2 : 2.1, 0, Math.PI * 2);
    wctx.fillStyle = active ? "#2c93e8" : "rgba(44,147,232,.5)"; wctx.fill();
    wctx.beginPath(); wctx.arc(ex - 1, ey, active ? 3 : 2, 0, Math.PI * 2);
    wctx.fillStyle = active ? "#72c4ff" : "rgba(114,196,255,.45)"; wctx.fill();
    wctx.restore();
  }

  function drawWires() {
    setWireSize();
    wctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!state.open) return;
    // 一个编号一条线：固定态优先于悬停态（滚动中误触发的 hover 不得篡改已选中的连线）
    const id = pinnedId || activeId;
    if (!id) return;
    const c = CS.changes.find(x => x.id === id);
    if (!c || !isOn(c) || !targeted(c)) return;
    const rec = anchorEls[id];
    if (!rec || !rec.last.shown) return;
    // 起点取锚点实时视口坐标（锚点在文档流中，滚动时坐标必须现算，不能用缓存）
    const ar = rec.el.getBoundingClientRect();
    if (ar.bottom < 0 || ar.top > innerHeight) return; // 锚点滚出视口则不画线
    const card = document.getElementById("da-note-" + id);
    if (!card) return;
    const cr = card.querySelector(".da-no").getBoundingClientRect();
    if (cr.bottom < 40 || cr.top > innerHeight - 8) return;
    wirePath(ar.right, ar.top + ar.height / 2, innerWidth - PANEL_W + 1, cr.top + cr.height / 2, true);
  }

  /* ---------- 高亮联动 ---------- */
  function applyActive() {
    // 固定态优先：钉住某编号后，悬停其他锚点不改变高亮与连线
    const id = pinnedId || activeId;
    CS.changes.forEach(c => {
      const rec = anchorEls[c.id];
      if (rec) rec.el.classList.toggle("da-active", c.id === id);
      const card = document.getElementById("da-note-" + c.id);
      if (card) card.classList.toggle("da-active", c.id === id);
    });
    drawWires();
  }
  function setActive(id) { activeId = id; applyActive(); }
  function clearActive(id) { if (activeId === id) { activeId = null; applyActive(); } }
  function togglePin(id) {
    pinnedId = pinnedId === id ? null : id;
    applyActive();
  }

  /* ---------- 定位 ---------- */
  function locateChange(c) {
    // 先执行页面钩子（可能需要打开弹窗），再轮询等待目标挂载/弹窗动画结束后定位。
    if (window.DIFF_HOOKS && typeof window.DIFF_HOOKS.locate === "function") window.DIFF_HOOKS.locate(c.page);
    else if (window.DIFF_HOOKS && typeof window.DIFF_HOOKS.showPage === "function") window.DIFF_HOOKS.showPage(c.page);
    if (!targeted(c)) { scheduleUpdate(); return; }
    let tries = 0;
    const attempt = () => {
      const el = document.querySelector(c.target);
      if (!el || !el.getClientRects().length) {
        if (++tries < 12) { setTimeout(attempt, 130); }
        return;
      }
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.classList.remove("da-pulsing"); void el.offsetWidth; el.classList.add("da-pulsing");
      setTimeout(() => el.classList.remove("da-pulsing"), 2000);
      scheduleUpdate();
      setTimeout(scheduleUpdate, 360); // 弹窗打开动画结束后再校准一次锚点与连线
    };
    setTimeout(attempt, 160);
  }
  function locateModule(key) { locateChange(byModule[key][0]); }

  /* ---------- 内容视口 ---------- */
  function syncScrollSpace() {
    if (!state.open) return;
    // 业务内容宽度用 document.body.scrollWidth 测：spacer 是 body 下的 absolute 子元素，
    // 它贡献的是 html 的滚动区而非 body.scrollWidth，所以测量全程不需要隐藏/移动 spacer——
    // scrollWidth 不会瞬间收缩，浏览器也就不会钳制 scrollLeft。
    // （旧实现先 display:none 再测量，页面若设了 scroll-behavior:smooth，恢复滚动是异步动画，
    //   会和用户正在进行的横向拖拽打架，表现为"一拽就弹回"。）
    const contentWidth = Math.max(document.documentElement.clientWidth, document.body.scrollWidth);
    const next = contentWidth + "px";
    scrollSpacer.style.display = "block";
    if (scrollSpacer.style.left !== next) {
      const sx = window.scrollX, sy = window.scrollY;
      scrollSpacer.style.left = next;
      // 内容变窄仍可能钳制一次，必须用 instant 立即恢复，绝不能吃页面的 scroll-behavior:smooth
      if (window.scrollX !== sx || window.scrollY !== sy) window.scrollTo({ left: sx, top: sy, behavior: "instant" });
    }
  }

  /* ---------- 弹窗跟随页面滚动 ----------
     Element 弹窗容器是 position:fixed，不随文档滚动。批注栏开着时：
     - 横滚：被批注栏遮住的弹窗右侧要能拖出来；
     - 纵滚：高于视口的弹窗底部要能跟着底页一起滚出。
     做法：批注栏开启时，把弹窗容器（不含蒙层）按 (-scrollX, -scrollY) 平移，
     弹窗与底层页面同步滑动；收起批注栏时清掉 transform。 */
  function syncDialogFollow() {
    const sx = state.open ? window.scrollX : 0;
    const sy = state.open ? window.scrollY : 0;
    const tf = (sx || sy) ? ("translate(" + (-sx) + "px," + (-sy) + "px)") : "";
    document.querySelectorAll(".el-dialog__wrapper, .el-overlay-dialog").forEach(w => {
      if (!(w.offsetWidth || w.offsetHeight)) return;
      if (w.style.transform !== tf) w.style.transform = tf;
    });
  }

  /* ---------- 开关 ---------- */
  function setOpen(open) {
    state.open = open;
    persist();
    document.documentElement.classList.toggle("da-open", open);
    document.body.classList.toggle("da-open", open);
    panel.style.display = open ? "" : "none";
    launcher.style.display = open ? "none" : "";
    if (open) {
      syncScrollSpace();
    } else {
      scrollSpacer.style.display = "none";
      if (scrollX) window.scrollTo(0, scrollY);
    }
    syncAnnotations();
  }
  launcher.addEventListener("click", () => setOpen(true));

  /* ---------- 更新调度 ---------- */
  let frame = 0;
  function scheduleUpdate() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(updateOverlay);
  }
  window.addEventListener("scroll", scheduleUpdate, { passive: true, capture: true });
  window.addEventListener("resize", () => {
    syncScrollSpace();
    scheduleUpdate();
  }, { passive: true });
  document.addEventListener("click", e => {
    if (e.target.closest("[data-da]")) return;
    setTimeout(scheduleUpdate, 60);
    setTimeout(scheduleUpdate, 360);
  }, true);
  const mo = new MutationObserver(records => {
    if (records.every(r => r.target && r.target.closest && r.target.closest("[data-da]"))) return;
    syncScrollSpace();
    scheduleUpdate();
  });
  mo.observe(document.body, { attributes: true, attributeFilter: ["class", "style"], childList: true, subtree: true });

  /* ---------- 初始 ---------- */
  if (window.DIFF_HOOKS && typeof window.DIFF_HOOKS.setDemoState === "function") {
    demoControls.forEach(control => window.DIFF_HOOKS.setDemoState(control.id, state.demo[control.id]));
  }
  renderPanel();
  setOpen(state.open);
  setTimeout(scheduleUpdate, 150);
})();

  </script>
</body>
</html>
